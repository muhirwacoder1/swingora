name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify the website
        run: python3 verify.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare project-relative links
        env:
          PAGES_BASE: ${{ github.event.repository.name }}
          PAGES_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/build_github_pages.py --base-path "$PAGES_BASE" --origin "https://$PAGES_OWNER.github.io"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
